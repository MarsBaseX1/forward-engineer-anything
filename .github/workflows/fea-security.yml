name: FEA Electron security demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-and-compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and integration tests
        run: npm test
      - name: Generate reproducible Electron demo artifacts
        run: npm run demo
      - name: Check resource trees and ASAR builds
        run: npm run demo:check
      - name: Run reproducible scripted Arena demo (not an AI benchmark)
        run: npm run arena:demo
      - name: Verify MCP read-only tools and local authorization reference
        run: |
          npm run mcp:demo
          npm run auth:demo
      - name: Verify external JSONL import contract (synthetic fixture only)
        run: npm run arena:import-demo
      - name: Execute bounded paired Arena through trusted synthetic adapter (not AI)
        run: npm run arena:execute-demo
      - name: Validate sanitized SARIF export from baseline and hardened demo
        run: npm run sarif:demo
      - name: Verify README data chart was generated from current demo
        shell: bash
        run: |
          node scripts/render-readme-chart.mjs
          git diff --exit-code -- assets/fea-demo-exposure.svg
      - name: Publish sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fea-demo-reports-${{ matrix.os }}
          path: demo/generated/reports/
          if-no-files-found: ignore
          retention-days: 7
