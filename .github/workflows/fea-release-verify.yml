name: FEA independent release verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to verify (for example 1.0.1)'
        required: true
        default: '1.0.1'
        type: string
      publish_after_verify:
        description: 'Publish the draft only after every independent check passes'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read

concurrency:
  group: fea-independent-release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-release:
    name: Read draft metadata and download assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Draft releases are listed only to identities with push access. This job does not execute the package.
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_is_draft: ${{ steps.release.outputs.release_is_draft }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    env:
      FEA_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Resolve the draft and pin its source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$FEA_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version, got: $FEA_RELEASE_VERSION" >&2
            exit 1
          fi
          all_releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          matches="$(jq --arg tag "v$FEA_RELEASE_VERSION" '[.[] | select(.tag_name == $tag)]' <<<"$all_releases")"
          if [[ "$(jq 'length' <<<"$matches")" != "1" ]]; then
            echo "Expected exactly one release record for v$FEA_RELEASE_VERSION." >&2
            jq -r '.[] | "visible release: tag=\(.tag_name) name=\(.name) draft=\(.draft)"' <<<"$all_releases" >&2
            exit 1
          fi
          release="$(jq '.[0]' <<<"$matches")"
          tag="$(jq -r '.tag_name' <<<"$release")"
          release_id="$(jq -r '.id' <<<"$release")"
          is_draft="$(jq -r '.draft' <<<"$release")"
          source_sha="$(jq -r '.target_commitish' <<<"$release")"
          if [[ "$tag" != "v$FEA_RELEASE_VERSION" || ! "$release_id" =~ ^[0-9]+$ || ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release metadata does not identify the expected version and a full source commit." >&2
            exit 1
          fi
          asset_count="$(jq '.assets | length' <<<"$release")"
          if [[ "$asset_count" != "3" && "$asset_count" != "5" ]]; then
            echo "Expected a legacy three-asset release or five-asset SBOM-enabled release." >&2
            exit 1
          fi
          tarball_asset_id="$(jq -r --arg name "marsbasex-fea-$FEA_RELEASE_VERSION.tgz" '.assets[] | select(.name == $name) | .id' <<<"$release")"
          npm_pack_asset_id="$(jq -r '.assets[] | select(.name == "npm-pack.json") | .id' <<<"$release")"
          checksums_asset_id="$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .id' <<<"$release")"
          sbom_asset_id="$(jq -r '.assets[] | select(.name == "sbom.spdx.json") | .id' <<<"$release")"
          audit_asset_id="$(jq -r '.assets[] | select(.name == "package-security-audit.json") | .id' <<<"$release")"
          if [[ "$asset_count" == "5" && ( ! "$sbom_asset_id" =~ ^[0-9]+$ || ! "$audit_asset_id" =~ ^[0-9]+$ ) ]]; then
            echo "SBOM-enabled release is missing a required SBOM or package audit asset." >&2
            exit 1
          fi
          for id in "$tarball_asset_id" "$npm_pack_asset_id" "$checksums_asset_id"; do
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "A required release asset ID is missing or ambiguous." >&2
              exit 1
            fi
          done
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tarball_asset_id=$tarball_asset_id" >> "$GITHUB_OUTPUT"
          echo "npm_pack_asset_id=$npm_pack_asset_id" >> "$GITHUB_OUTPUT"
          echo "checksums_asset_id=$checksums_asset_id" >> "$GITHUB_OUTPUT"
          echo "sbom_asset_id=$sbom_asset_id" >> "$GITHUB_OUTPUT"
          echo "audit_asset_id=$audit_asset_id" >> "$GITHUB_OUTPUT"
          {
            echo "### Release under verification"
            echo "- Tag: \`$tag\`"
            echo "- Draft: \`$is_draft\`"
            echo "- Source commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download exact assets using the authenticated GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/fea-release-assets"
          mkdir -p "$dir"
          for pair in \
            "${{ steps.release.outputs.tarball_asset_id }}|marsbasex-fea-$FEA_RELEASE_VERSION.tgz" \
            "${{ steps.release.outputs.npm_pack_asset_id }}|npm-pack.json" \
            "${{ steps.release.outputs.checksums_asset_id }}|SHA256SUMS.txt"; do
            asset_id="${pair%%|*}"
            asset_name="${pair#*|}"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$dir/$asset_name"
          done
          if [[ "${{ steps.release.outputs.sbom_asset_id }}" =~ ^[0-9]+$ ]]; then
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.release.outputs.sbom_asset_id }}" > "$dir/sbom.spdx.json"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.release.outputs.audit_asset_id }}" > "$dir/package-security-audit.json"
          fi
      - name: Pass downloaded files to a separate read-only verification job
        uses: actions/upload-artifact@v4
        with:
          name: fea-release-assets-to-verify
          path: ${{ runner.temp }}/fea-release-assets/*
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify downloaded release assets in isolation
    needs: download-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      FEA_RELEASE_VERSION: ${{ inputs.version }}
      FEA_SOURCE_SHA: ${{ needs.download-release.outputs.source_sha }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install current GitHub CLI and require patched attestation verification
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes gh
          gh version
          actual="$(gh version | awk 'NR==1 {print $3}')"
          if [[ "$(printf '%s\n' '2.102.0' "$actual" | sort -V | head -n1)" != "2.102.0" ]]; then
            echo "GitHub CLI 2.102.0 or newer is required for the patched signer-workflow identity check (found $actual)." >&2
            exit 1
          fi
      - name: Retrieve the exact release assets from the isolated download job
        uses: actions/download-artifact@v4
        with:
          name: fea-release-assets-to-verify
          path: ${{ runner.temp }}/fea-release-assets
      - name: Set the asset directory
        shell: bash
        run: echo "FEA_ASSET_DIR=$RUNNER_TEMP/fea-release-assets" >> "$GITHUB_ENV"
      - name: Verify exact asset set, SHA-256, npm metadata and tarball contents
        shell: bash
        run: |
          set -euo pipefail
          expected_tarball="marsbasex-fea-$FEA_RELEASE_VERSION.tgz"
          expected="$(printf '%s\n' "$expected_tarball" 'npm-pack.json' 'SHA256SUMS.txt' | LC_ALL=C sort)"
          if [[ -f "$FEA_ASSET_DIR/sbom.spdx.json" && -f "$FEA_ASSET_DIR/package-security-audit.json" ]]; then
            expected="$(printf '%s\n' "$expected" 'sbom.spdx.json' 'package-security-audit.json' | LC_ALL=C sort)"
          elif [[ -e "$FEA_ASSET_DIR/sbom.spdx.json" || -e "$FEA_ASSET_DIR/package-security-audit.json" ]]; then
            echo "Incomplete SBOM/audit asset pair." >&2
            exit 1
          fi
          actual="$(find "$FEA_ASSET_DIR" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release asset set." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          (cd "$FEA_ASSET_DIR" && sha256sum -c SHA256SUMS.txt)
          if [[ -f "$FEA_ASSET_DIR/sbom.spdx.json" ]]; then
            FEA_ASSET_DIR="$FEA_ASSET_DIR" FEA_RELEASE_VERSION="$FEA_RELEASE_VERSION" node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.FEA_ASSET_DIR;
          const version = process.env.FEA_RELEASE_VERSION;
          const tarball = fs.readFileSync(path.join(dir, 'marsbasex-fea-' + version + '.tgz'));
          const sha256 = crypto.createHash('sha256').update(tarball).digest('hex');
          const sbom = JSON.parse(fs.readFileSync(path.join(dir, 'sbom.spdx.json'), 'utf8'));
          const audit = JSON.parse(fs.readFileSync(path.join(dir, 'package-security-audit.json'), 'utf8'));
          assert.equal(sbom.spdxVersion, 'SPDX-2.3');
          assert.equal(sbom.packages[0].name, '@marsbasex/fea');
          assert.equal(sbom.packages[0].versionInfo, version);
          assert.equal(sbom.packages[0].checksums[0].checksumValue, sha256, 'SBOM does not describe the downloaded tarball');
          assert.equal(audit.result, 'PASS', 'Package audit did not pass');
          assert.equal(audit.package.sha256, sha256, 'Audit report does not match downloaded tarball');
          assert.ok(audit.checks.length >= 10 && audit.checks.every(item => item.result === 'pass'));
          console.log('SPDX SBOM and package audit are bound to the verified tarball SHA-256.');
          NODE
          fi
          FEA_ASSET_DIR="$FEA_ASSET_DIR" FEA_RELEASE_VERSION="$FEA_RELEASE_VERSION" node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const dir = process.env.FEA_ASSET_DIR;
          const version = process.env.FEA_RELEASE_VERSION;
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'npm-pack.json'), 'utf8'));
          assert.equal(manifest.length, 1, 'Expected exactly one npm pack entry');
          const item = manifest[0];
          const filename = 'marsbasex-fea-' + version + '.tgz';
          assert.equal(item.name, '@marsbasex/fea');
          assert.equal(item.version, version);
          assert.equal(item.filename, filename);
          const tarballPath = path.join(dir, filename);
          const bytes = fs.readFileSync(tarballPath);
          assert.equal(bytes.length, item.size, 'Tarball size differs from npm-pack.json');
          assert.equal(crypto.createHash('sha1').update(bytes).digest('hex'), item.shasum, 'npm shasum mismatch');
          assert.equal('sha512-' + crypto.createHash('sha512').update(bytes).digest('base64'), item.integrity, 'npm integrity mismatch');
          const manifestFiles = new Set(item.files.map(file => file.path));
          const required = [
            'src/cli.mjs', 'src/core.mjs', 'README.md', 'README.en.md',
            'CHANGELOG.md', 'CONTRIBUTING.md', 'SECURITY.md', 'LICENSE', 'assets/fea-icon.png'
          ];
          for (const file of required) assert(manifestFiles.has(file), 'Required package file missing: ' + file);
          assert(manifestFiles.size < 140, 'Unexpectedly large npm package');
          for (const file of manifestFiles) {
            assert(!/(^|\/)(?:test|tests|demo|\.github|node_modules|tmp)(?:\/|$)/i.test(file), 'Private/test file in package: ' + file);
            assert(!/\.(?:pem|key|pfx|p12|map)$/i.test(file), 'Sensitive or source-map file in package: ' + file);
          }
          const entries = execFileSync('tar', ['-tzf', tarballPath], { encoding: 'utf8' })
            .split(/\r?\n/).filter(Boolean).filter(entry => !entry.endsWith('/'));
          const actualFiles = new Set(entries.map(entry => entry.replace(/^package\//, '')));
          assert.equal(actualFiles.size, manifestFiles.size, 'Tarball file count differs from npm-pack.json');
          for (const file of manifestFiles) assert(actualFiles.has(file), 'Manifest file absent from tarball: ' + file);
          for (const file of actualFiles) assert(manifestFiles.has(file), 'Unlisted file in tarball: ' + file);
          console.log('Verified @marsbasex/fea@' + version + ': ' + bytes.length + ' bytes, ' + actualFiles.size + ' files, SHA-1 and SHA-512 match npm metadata.');
          NODE
      - name: Verify all three signed build-provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("marsbasex-fea-$FEA_RELEASE_VERSION.tgz" "npm-pack.json" "SHA256SUMS.txt")
          if [[ -f "$FEA_ASSET_DIR/sbom.spdx.json" ]]; then
            assets+=("sbom.spdx.json" "package-security-audit.json")
          fi
          for asset in "${assets[@]}"; do
            echo "Verifying provenance for $asset"
            gh attestation verify "$FEA_ASSET_DIR/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/fea-release-package.yml" \
              --source-ref refs/heads/main \
              --source-digest "$FEA_SOURCE_SHA" \
              --deny-self-hosted-runners
          done
      - name: Install downloaded tarball in a clean consumer and exercise CLI
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/fea-release-consumer"
          mkdir -p "$consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund \
            --prefix "$consumer" "$FEA_ASSET_DIR/marsbasex-fea-$FEA_RELEASE_VERSION.tgz"
          bin="$consumer/node_modules/.bin/fea"
          "$bin" --help | tee "$RUNNER_TEMP/fea-cli-help.txt"
          grep -Fq 'Electron release-resource security checks (stable)' "$RUNNER_TEMP/fea-cli-help.txt"
          mkdir -p "$consumer/resources"
          printf 'const greeting = "hello";\n' > "$consumer/resources/index.js"
          (
            cd "$consumer"
            "$bin" init --out .fea.json
            "$bin" scan resources --config .fea.json --out reports
            "$bin" verify reports/report.json --policy .fea.json
          )
          echo "Independent downloaded-package install and CLI smoke test passed." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish only after independent verification
    needs: [download-release, verify]
    if: >-
      needs.download-release.outputs.release_is_draft == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_after_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FEA_RELEASE_VERSION: ${{ inputs.version }}
      FEA_RELEASE_ID: ${{ needs.download-release.outputs.release_id }}
      FEA_SOURCE_SHA: ${{ needs.download-release.outputs.source_sha }}
    steps:
      - name: Publish the already-verified draft without replacing assets
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/$GITHUB_REPOSITORY/releases/$FEA_RELEASE_ID")"
          test "$(jq -r '.tag_name' <<<"$before")" = "v$FEA_RELEASE_VERSION"
          test "$(jq -r '.draft' <<<"$before")" = "true"
          test "$(jq -r '.target_commitish' <<<"$before")" = "$FEA_SOURCE_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$FEA_RELEASE_ID" -F draft=false >/dev/null
          after="$(gh api "repos/$GITHUB_REPOSITORY/releases/$FEA_RELEASE_ID")"
          test "$(jq -r '.tag_name' <<<"$after")" = "v$FEA_RELEASE_VERSION"
          test "$(jq -r '.draft' <<<"$after")" = "false"
          test "$(jq -r '.published_at' <<<"$after")" != "null"
          url="$(jq -r '.html_url' <<<"$after")"
          {
            echo "## FEA release published after independent verification"
            echo "- Version: \`v$FEA_RELEASE_VERSION\`"
            echo "- Verified source commit: \`$FEA_SOURCE_SHA\`"
            echo "- Public release: $url"
            echo "- Checks passed: SHA-256, npm metadata, tarball manifest, GitHub build provenance, isolated npm install and CLI smoke test."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published verified release: $url"
